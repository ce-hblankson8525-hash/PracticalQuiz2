<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Beach Island</title>
<style>
  :root{--gold:#f4cf5a;--ink:#2b2a1c}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1a2a;font-family:Georgia,'Times New Roman',serif}
  canvas{display:block;width:100%;height:100%}
  #title{position:fixed;left:22px;top:16px;color:#fff6dc;text-shadow:0 2px 10px rgba(0,0,0,.55);pointer-events:none}
  #title h1{margin:0;font-size:clamp(24px,4.4vw,44px);font-weight:600;letter-spacing:.5px}
  #title p{margin:4px 0 0;font-size:clamp(14px,2vw,20px);opacity:.92}
  #panel{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:168px;
    background:rgba(38,36,22,.82);backdrop-filter:blur(6px);border-radius:12px;padding:10px 12px 12px;color:#fff6dc;
    box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:13px}
  .row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
  .row+.row{margin-top:8px}
  #slider{flex:1;min-width:70px;-webkit-appearance:none;appearance:none;height:9px;border-radius:6px;outline:none;
    background:linear-gradient(90deg,#ffe58a,#ffb259 45%,#5a4f9a 70%,#1b2147)}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid #fff8dc;cursor:pointer}
  #slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #fff8dc;cursor:pointer}
  button{font:inherit;font-size:12px;background:var(--gold);color:var(--ink);border:0;border-radius:7px;padding:4px 8px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  label{display:flex;align-items:center;gap:5px;font-size:12px;cursor:pointer}
  input[type=checkbox]{width:13px;height:13px;margin:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1a2a;color:#fff6dc;font-size:22px;transition:opacity .6s}
  #err{position:fixed;left:20px;right:20px;top:90px;color:#fff;background:#a33;padding:12px;border-radius:8px;display:none;z-index:9}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="title"><p>Drag to orbit, scroll to zoom</p></div>
<div id="panel">
  <div class="row"><span>Day</span><input id="slider" type="range" min="0" max="1" step="0.001" value="0"><span>Night</span></div>
  <div class="row">
    <button id="bDay">Day</button><button id="bSun">Sunset</button><button id="bNight">Night</button>
  </div>
  <div class="row">
    <button id="bTable">Table close-up</button><button id="bIsland">Whole island</button>
  </div>
  <div class="row">
    <label><input id="rot" type="checkbox" checked> Auto-rotate</label>
  </div>
</div>
<div id="loading">Building the island...</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => { const d = document.getElementById('err'); d.style.display = 'block'; d.textContent = 'Error: ' + e.message; });

/* ---------- helpers ---------- */
let seed = 20261122;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI;

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function speckle(g, w, h, n, cols, sMin, sMax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = cols[(rnd() * cols.length) | 0];
    const s = rr(sMin, sMax); g.fillRect(rnd() * w, rnd() * h, s, s);
  }
}
const std = (color, rough = .8, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfe0f5, 0.0016);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 6000);
camera.position.set(24, 17, 31);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 2);
controls.enableDamping = true; controls.dampingFactor = .06;
controls.minDistance = 1.2; controls.maxDistance = 220;
controls.maxPolarAngle = PI * 0.495;
controls.autoRotate = true; controls.autoRotateSpeed = .55;

/* ---------- sky dome ---------- */
const skyU = {
  top: { value: new THREE.Color() }, hor: { value: new THREE.Color() },
  sunDir: { value: new THREE.Vector3(0, 1, 0) }, glow: { value: new THREE.Color(1, .6, .3) }, sunI: { value: 1 }
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 glow; uniform float sunI; varying vec3 vD;
    void main(){ float h = clamp(vD.y,0.0,1.0); vec3 c = mix(hor, top, pow(h,0.55));
      float s = max(dot(normalize(vD), normalize(sunDir)),0.0);
      c += glow * (pow(s,6.0)*0.35 + pow(s,40.0)*0.5) * sunI;
      c += vec3(1.0,0.95,0.8) * smoothstep(0.9993,0.9998,s) * sunI * 3.0;
      if (vD.y < 0.0) c = mix(hor, hor*0.5, clamp(-vD.y*4.0,0.0,1.0));
      gl_FragColor = vec4(c,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
{ const p = []; for (let i = 0; i < 1600; i++) { const a = rnd() * PI * 2, e = Math.asin(rr(.03, 1)); const R = 2300;
    p.push(Math.cos(a) * Math.cos(e) * R, Math.sin(e) * R, Math.sin(a) * Math.cos(e) * R); }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); }
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
scene.add(new THREE.Points(starGeo, starMat));
const moon = new THREE.Mesh(new THREE.SphereGeometry(70, 32, 16), new THREE.MeshBasicMaterial({ color: 0xf4f1e6, fog: false }));
scene.add(moon);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6a7a4a, .8); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xfff0d0, 3);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 10, far: 900 });
sunL.shadow.bias = -0.0004; sunL.shadow.normalBias = .04;
scene.add(sunL, sunL.target);
const moonL = new THREE.DirectionalLight(0x8fb0ff, 0);
moonL.castShadow = true; moonL.shadow.mapSize.set(1024, 1024);
Object.assign(moonL.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 10, far: 900 });
moonL.shadow.bias = -0.0006; moonL.shadow.normalBias = .05;
scene.add(moonL, moonL.target);

const glowMats = [];   // {m, day, night}
const pLights = [];    // {l, day, night}
function glowMat(color, day, night, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: day, roughness: .4, ...extra });
  glowMats.push({ m, day, night }); return m;
}
function pointLight(x, y, z, color, night, dist = 14, day = 0) {
  const l = new THREE.PointLight(color, 0, dist, 2); l.position.set(x, y, z); scene.add(l);
  pLights.push({ l, day, night }); return l;
}

/* ---------- mesh helper ---------- */
function add(geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.s) m.scale.set(...(Array.isArray(o.s) ? o.s : [o.s, o.s, o.s]));
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
  (o.parent || scene).add(m); return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (rt, rb, h, s = 24) => new THREE.CylinderGeometry(rt, rb, h, s);
const sph = (r, a = 20, b = 14) => new THREE.SphereGeometry(r, a, b);

/* ---------- textures ---------- */
const sandTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#d9bd88'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 9000, ['#c9ab75', '#e8cf9d', '#bfa066', '#efd9ab'], 1, 3); }, 40, 40);
const grassTex = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#2f8a2a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 12000, ['#37a232', '#27751f', '#47b43c', '#1f6a1a'], 1, 3); }, 14, 14);
const paverTex = canvasTex(512, 512, (g, w, h) => {
  const n = 8, s = w / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const l = 62 + rnd() * 10; g.fillStyle = `hsl(36,${50 + rnd() * 15}%,${l}%)`;
    g.fillRect(x * s + 2, y * s + 2, s - 4, s - 4); }
  g.strokeStyle = '#8d6b3a'; g.lineWidth = 3; for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
}, 4, 4);
const woodTex = (base, dark, rx = 1, ry = 1) => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 80; i++) { g.strokeStyle = dark; g.globalAlpha = rr(.08, .3); g.lineWidth = rr(1, 3);
    const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rr(-5, 5), w * .7, y + rr(-5, 5), w, y + rr(-4, 4)); g.stroke(); }
  g.globalAlpha = 1; }, rx, ry);
const roofTex = canvasTex(256, 256, (g, w, h) => {
  const rows = 8; for (let r = 0; r < rows; r++) { const y = r * h / rows; const off = (r % 2) * 16;
    for (let x = -16; x < w + 16; x += 32) { g.fillStyle = `hsl(${8 + rnd() * 6},${55 + rnd() * 10}%,${22 + rnd() * 9}%)`;
      g.fillRect(x + off + 1, y + 1, 30, h / rows - 2); } } }, 6, 3);
const rugTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9d1f1f'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#f0d58a'; g.lineWidth = 8; g.strokeRect(14, 14, w - 28, h - 28);
  g.strokeStyle = '#f7ecd0'; g.lineWidth = 4; g.strokeRect(34, 34, w - 68, h - 68);
  g.fillStyle = '#e9b44c'; g.translate(w / 2, h / 2); g.rotate(PI / 4); g.fillRect(-40, -40, 80, 80);
  g.fillStyle = '#9d1f1f'; g.fillRect(-26, -26, 52, 52); });
const stripeTex = (c1, c2, n) => canvasTex(256, 64, (g, w, h) => { const s = w / n; for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? c2 : c1; g.fillRect(i * s, 0, s + 1, h); } }, 1, 1);
const labelTex = (bg, band, text, fg) => canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = band; g.fillRect(0, h * .22, w, h * .56);
  g.fillStyle = fg; g.font = 'bold 84px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h * .52);
  g.fillStyle = fg; g.fillRect(0, h * .17, w, 6); g.fillRect(0, h * .78, w, 6); });

/* =====================================================================
   GROUND:  lawn, sand, sea, hills
   ===================================================================== */
const LAWN_TOP = .1;
add(cyl(37, 41, 1.4, 128), std(0xffffff, 1, 0, { map: sandTex }), 0, -.7, 0, { cast: false });
add(cyl(15, 16.2, .6, 96), std(0xffffff, 1, 0, { map: grassTex }), 0, LAWN_TOP - .3, 0, { cast: false });
add(new THREE.TorusGeometry(38.4, .35, 6, 160), std(0xffffff, .5, 0, { transparent: true, opacity: .75 }), 0, -.15, 0, { rot: [PI / 2, 0, 0], cast: false, recv: false });

const seaGeo = new THREE.PlaneGeometry(1000, 1000, 200, 200); seaGeo.rotateX(-PI / 2);
const seaPos = seaGeo.attributes.position; const seaCol = new Float32Array(seaPos.count * 3);
const cShallow = new THREE.Color(.16, .78, .76), cMid = new THREE.Color(.02, .42, .62), cDeep = new THREE.Color(.01, .17, .38);
for (let i = 0; i < seaPos.count; i++) {
  const r = Math.hypot(seaPos.getX(i), seaPos.getZ(i)); const c = new THREE.Color();
  if (r < 62) c.copy(cShallow).lerp(cMid, sstep(38, 62, r)); else c.copy(cMid).lerp(cDeep, sstep(62, 160, r));
  seaCol.set([c.r, c.g, c.b], i * 3);
}
seaGeo.setAttribute('color', new THREE.BufferAttribute(seaCol, 3));
const seaMat = std(0xffffff, .18, .15, { vertexColors: true });
const sea = add(seaGeo, seaMat, 0, -.55, 0, { cast: false });
const seaBase = Float32Array.from(seaPos.array);
add(new THREE.PlaneGeometry(9000, 9000).rotateX(-PI / 2), std(0x063055, .2), 0, -1.2, 0, { cast: false });
for (let i = 0; i < 7; i++) {   // distant tropical hills
  const a = (i / 7) * PI * 2 + .3, R = rr(620, 780);
  add(sph(1, 24, 12), std(i % 2 ? 0x2f7d6e : 0x3b8a68, 1), Math.cos(a) * R, -40, Math.sin(a) * R, { s: [rr(150, 260), rr(70, 120), rr(110, 180)], cast: false, recv: false });
}

/* =====================================================================
   PAVILION  (deck, posts, hip roof, fairy lights)
   ===================================================================== */
const BASE = LAWN_TOP + .22;   // top of deck
add(new THREE.CircleGeometry(7.4, 64).rotateX(-PI / 2), std(0xffffff, .9, 0, { map: paverTex }), 0, LAWN_TOP + .01, 0, { cast: false });
const deckMat = std(0xffffff, .8, 0, { map: woodTex('#b5793c', '#6a3f17', 3, 3) });
add(box(8.2, .22, 7.2), deckMat, 0, LAWN_TOP + .11, 0);
const postMat = std(0xffffff, .7, 0, { map: woodTex('#3b2412', '#1b0f07', 1, 3) });
const PH = 3.3, PX = 3.7, PZ = 3.2;
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  add(box(.26, PH, .26), postMat, sx * PX, BASE + PH / 2, sz * PZ);
  add(box(.4, .12, .4), postMat, sx * PX, BASE + .06, sz * PZ);
}
for (const sz of [-1, 1]) add(box(PX * 2 + .8, .22, .28), postMat, 0, BASE + PH + .1, sz * PZ);
for (const sx of [-1, 1]) add(box(.28, .22, PZ * 2 + .8), postMat, sx * PX, BASE + PH + .12, 0);
for (let i = -3; i <= 3; i++) add(box(.12, .14, PZ * 2 + 1.2), postMat, i * 1.15, BASE + PH + .26, 0);
const roof = add(new THREE.ConeGeometry(6.9, 2.5, 4, 1, false), std(0xffffff, .7, 0, { map: roofTex }), 0, BASE + PH + .33 + 1.25, 0, { rot: [0, PI / 4, 0], s: [1.04, 1, .93] });
add(box(8.7, .12, 7.8), std(0x2a1a0e, .8), 0, BASE + PH + .36, 0);
add(sph(.16, 12, 10), std(0xd9a441, .35, .6), 0, BASE + PH + .33 + 2.6, 0);
add(cyl(.05, .05, .5, 8), std(0xd9a441, .35, .6), 0, BASE + PH + .33 + 2.35, 0);

/* fairy lights */
const fairyMat = glowMat(0xffe2a0, .5, 14, { roughness: .3 });
const fairyBulbs = [];
function fairyString(p0, p1, sag, n) {
  for (let i = 0; i <= n; i++) { const t = i / n; const p = new THREE.Vector3().lerpVectors(p0, p1, t); p.y -= sag * 4 * t * (1 - t); fairyBulbs.push(p); }
}
for (const z of [-2.6, -.9, .9, 2.6]) fairyString(new THREE.Vector3(-PX, BASE + PH - .05, z), new THREE.Vector3(PX, BASE + PH - .05, z), .45, 24);
for (const x of [-PX, PX]) fairyString(new THREE.Vector3(x, BASE + PH - .05, -PZ), new THREE.Vector3(x, BASE + PH - .05, PZ), .3, 18);
const fairyI = new THREE.InstancedMesh(sph(.055, 8, 6), fairyMat, fairyBulbs.length);
fairyBulbs.forEach((p, i) => fairyI.setMatrixAt(i, new THREE.Matrix4().setPosition(p))); scene.add(fairyI);
pointLight(0, BASE + 2.6, 0, 0xffc880, 38, 16);

/* hanging lantern */
add(cyl(.01, .01, .6, 6), postMat, 0, BASE + PH - .3, 0, { cast: false });
const lanternMat = glowMat(0xffd27a, .5, 9, { transparent: true, opacity: .95 });
add(cyl(.17, .17, .38, 12), lanternMat, 0, BASE + 2.45, 0, { cast: false });
add(cyl(.05, .24, .12, 12), std(0x222222, .5, .6), 0, BASE + 2.7, 0);
pointLight(0, BASE + 2.4, 0, 0xffb860, 22, 10);

/* =====================================================================
   TABLE, CHAIRS, MILO TIN, MILK TIN, CUPS
   ===================================================================== */
add(box(3.9, .02, 2.8), std(0xffffff, 1, 0, { map: rugTex }), 0, BASE + .011, 0, { cast: false });
const tableMat = std(0xffffff, .5, 0, { map: woodTex('#9b5a28', '#4a260c', 1, 1) });
const TH = .78;
add(box(2.7, .09, 1.35), tableMat, 0, BASE + TH, 0);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(box(.11, TH - .04, .11), tableMat, sx * 1.2, BASE + (TH - .04) / 2, sz * .55);
add(box(2.3, .02, .1), std(0x9d1f1f, .9), 0, BASE + TH + .055, 0, { cast: false });   // runner
const TOP = BASE + TH + .045;

function chair(x, z, ry) {
  const g = new THREE.Group(); g.position.set(x, BASE, z); g.rotation.y = ry; scene.add(g);
  const wm = std(0xffffff, .6, 0, { map: woodTex('#a96a30', '#52290d', 1, 1) });
  add(box(.54, .07, .52), wm, 0, .5, 0, { parent: g });
  add(box(.47, .06, .45), std(0xc23a2e, .9), 0, .565, 0, { parent: g });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(box(.055, .5, .055), wm, sx * .23, .25, sz * .22, { parent: g });
  for (const sx of [-1, 1]) add(box(.055, .62, .055), wm, sx * .23, .5 + .31 + .035, .24, { parent: g, rot: [-.08, 0, 0] });
  for (let i = 0; i < 3; i++) add(box(.43, .08, .03), wm, 0, .72 + i * .15, .245 + i * .006, { parent: g, rot: [-.08, 0, 0] });
}
chair(-.6, 1.12, 0); chair(.6, 1.12, 0); chair(-.6, -1.12, PI); chair(.6, -1.12, PI);
chair(1.85, 0, PI / 2); chair(-1.85, 0, -PI / 2);

/* MiLo tin */
const miloBody = new THREE.MeshStandardMaterial({ map: labelTex('#198a3a', '#0e6b2b', 'MILO', '#ffffff'), roughness: .35, metalness: .5 });
const miloG = new THREE.Group(); miloG.position.set(-.62, TOP, -.05); scene.add(miloG);
add(cyl(.14, .14, .3, 32), miloBody, 0, .15, 0, { parent: miloG });
add(cyl(.145, .145, .045, 32), std(0xc41e1e, .35, .5), 0, .32, 0, { parent: miloG });
add(cyl(.12, .12, .02, 32), std(0xd7d7d7, .25, .9), 0, .35, 0, { parent: miloG });
add(new THREE.TorusGeometry(.04, .008, 8, 16), std(0xd7d7d7, .25, .9), 0, .365, 0, { parent: miloG, rot: [PI / 2, 0, 0] });
miloG.rotation.y = PI + .25;
/* Milk tin */
const milkBody = new THREE.MeshStandardMaterial({ map: labelTex('#ffffff', '#1f64c8', 'MILK', '#ffffff'), roughness: .35, metalness: .5 });
const milkG = new THREE.Group(); milkG.position.set(-.18, TOP, .18); scene.add(milkG);
add(cyl(.115, .115, .24, 32), milkBody, 0, .12, 0, { parent: milkG });
add(cyl(.12, .12, .03, 32), std(0xe8e8e8, .3, .8), 0, .255, 0, { parent: milkG });
add(cyl(.105, .105, .015, 32), std(0xd7d7d7, .25, .9), 0, .277, 0, { parent: milkG });
milkG.rotation.y = PI - .2;

/* cups + saucers */

  for (let i = 0; i < n; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }

}

  const dayF = sstep(-.12, .22, Math.sin(elev));         // 1 in daylight
  const nf = sstep(.32, .78, n);                          // 1 deep night
  const low = 1 - sstep(.05, .6, Math.sin(elev)) ;        // 1 when the sun is low

  // sky colours
  const k = n < .5 ? [K.day, K.sun, n / .5] : [K.sun, K.night, (n - .5) / .5];
  const t = sstep(0, 1, k[2]);
  skyU.top.value.copy(k[0][0]).lerp(k[1][0], t); skyU.hor.value.copy(k[0][1]).lerp(k[1][1], t);
  skyU.sunDir.value.copy(sunDir); skyU.glow.value.setRGB(1, .55 + .25 * (1 - low), .25 + .35 * (1 - low));
  skyU.sunI.value = sstep(-.12, .02, Math.sin(elev));
  scene.fog.color.copy(skyU.hor.value); scene.fog.density = lerp(.0014, .0021, nf);

  // sun / moon / hemi
  sunL.position.copy(sunDir).multiplyScalar(400); sunL.intensity = 3.4 * dayF;
  sunL.color.setRGB(1, lerp(.95, .55, low), lerp(.85, .3, low));
  moonL.position.copy(moonDir).multiplyScalar(400); moonL.intensity = .8 * nf;
  moon.position.copy(moonDir).multiplyScalar(1900); moon.material.opacity = 1; moon.visible = nf > .02;
  starMat.opacity = sstep(.45, .85, n);
  hemi.intensity = .12 + .75 * dayF * (1 - .25 * low) + .12 * nf;
  hemi.color.copy(skyU.top.value).lerp(new THREE.Color(1, 1, 1), .55 * dayF + .15);
  hemi.groundColor.setRGB(lerp(.1, .5, dayF), lerp(.12, .55, dayF), lerp(.2, .35, dayF));
  renderer.toneMappingExposure = lerp(1.0, 1.25, nf);

  // emissive things + lights
  glowMats.forEach(o => { o.m.emissiveIntensity = lerp(o.day, o.night, sstep(.28, .7, n)); });
  pLights.forEach(o => { o.l.intensity = lerp(o.day, o.night, sstep(.28, .7, n)); });
  if (window.__beam) window.__beam.material.opacity = .13 * sstep(.4, .8, n);
}

/* =====================================================================
   UI + camera tween
   ===================================================================== */
const slider = document.getElementById('slider'), rotBox = document.getElementById('rot');
slider.addEventListener('input', () => applyTime(+slider.value));
const setN = v => { slider.value = v; applyTime(v); };
document.getElementById('bDay').onclick = () => setN(0);
document.getElementById('bSun').onclick = () => setN(.5);
document.getElementById('bNight').onclick = () => setN(1);
rotBox.onchange = () => controls.autoRotate = rotBox.checked;
let tween = null;
function flyTo(pos, tgt) { tween = { t: 0, p0: camera.position.clone(), g0: controls.target.clone(), p1: new THREE.Vector3(...pos), g1: new THREE.Vector3(...tgt) }; }
document.getElementById('bTable').onclick = () => { rotBox.checked = false; controls.autoRotate = false; flyTo([.5, 2.75, 2.5], [-.05, 1.0, 0]); };
document.getElementById('bIsland').onclick = () => flyTo([24, 17, 31], [0, 1, 2]);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* =====================================================================
   ANIMATION LOOP
   ===================================================================== */
const clock = new THREE.Clock(); let frame = 0;
applyTime(0);
function loop() {
  requestAnimationFrame(loop);
  const raw = clock.getDelta(), dt = Math.min(raw, .05), T = clock.elapsedTime; frame++;
  if (tween) { tween.t += Math.min(raw, .25) / 1.6; const e = sstep(0, 1, tween.t); camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.g0, tween.g1, e); if (tween.t >= 1) tween = null; }
  if (frame % 2 === 0) { for (let i = 0; i < seaPos.count; i++) { const x = seaBase[i * 3], z = seaBase[i * 3 + 2]; const r = Math.hypot(x, z); seaPos.setY(i, r < 40 ? 0 : (Math.sin(x * .09 + T * .8) + Math.cos(z * .11 + T * .6)) * .09); } seaPos.needsUpdate = true; if (frame % 6 === 0) seaGeo.computeVertexNormals(); }
  for (let i = 0; i < SP; i++) { const s = spVel[i]; s.t += dt * 1.1; if (s.t > 2) s.t = 0; const u = s.t; const r = s.s * u * .5;
    spPos[i * 3] = FX + Math.cos(s.a) * r; spPos[i * 3 + 1] = LAWN_TOP + 1.7 + s.s * 1.7 * u - 2.4 * u * u * s.s; spPos[i * 3 + 2] = FZ + Math.sin(s.a) * r; }
  spGeo.attributes.position.needsUpdate = true;
  palms.forEach(p => { p.top.rotation.z = Math.sin(T * .9 + p.ph) * .025; p.top.rotation.x = Math.cos(T * .7 + p.ph) * .025; });
  flames.forEach((f, i) => { const s = 1 + Math.sin(T * 11 + i * 2) * .14 + Math.sin(T * 17 + i) * .08; f.scale.set(1, s, 1); });
  if (fireLight) fireLight.position.y = 1 + Math.sin(T * 9) * .08;
  boats.forEach(b => { b.a += b.sp * dt; b.g.position.set(Math.cos(b.a) * b.r, -.3 + Math.sin(T * 1.2 + b.ph) * .12, Math.sin(b.a) * b.r); b.g.rotation.y = -b.a + (b.sp > 0 ? 0 : PI); b.g.rotation.z = Math.sin(T * 1.1 + b.ph) * .05; });
  gulls.forEach(s => { s.a += s.sp * dt; s.g.position.set(Math.cos(s.a) * s.R, s.h + Math.sin(T + s.ph) * 1.2, Math.sin(s.a) * s.R); s.g.rotation.y = -s.a; const f = Math.sin(T * 7 + s.ph) * .5; s.wl.rotation.z = f; s.wr.rotation.z = -f; });
  flies.forEach(f => { const a = T * .5 + f.ph; f.g.position.set(f.cx + Math.cos(a) * 2.2, 1 + Math.sin(a * 1.7) * .5, f.cz + Math.sin(a * 1.3) * 2.2); f.g.rotation.y = -a; const w = Math.sin(T * 18 + f.ph) * .9; f.w1.rotation.z = w; f.w2.rotation.z = -w; });
  clouds.forEach(c => { c.g.position.x += c.sp * dt; if (c.g.position.x > 520) c.g.position.x = -520; });
  if (window.__beamPivot) window.__beamPivot.rotation.y = T * .8;
  moon.lookAt(camera.position);
  controls.update();
  renderer.render(scene, camera);
}
document.getElementById('loading').style.opacity = 0; setTimeout(() => document.getElementById('loading').remove(), 700);
window.__ready = true; window.__dbg = { camera, controls };
loop();
</script>
